[project]
name = "edi-linter"
version = "0.0.1"
description = "A piece-by-piece linter for X12 EDI flat files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]
dependencies = []

[project.scripts]
edi-linter = "edi_linter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edi_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
