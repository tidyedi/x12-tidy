[project]
name = "x12-tidy"
version = "0.1.0"
description = "Validate and repair malformed ANSI X12 EDI documents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]
dependencies = []
keywords = [
    "x12",
    "edi",
    "ansi-x12",
    "edi-validation",
    "x12-parser",
    "isa",
    "interchange-envelope",
    "healthcare-edi",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.tidyedi.com"
Repository = "https://github.com/tidyedi/x12-tidy"
Changelog = "https://github.com/tidyedi/x12-tidy/releases"
"Web tool" = "https://repair.tidyedi.com"

[project.scripts]
x12-tidy = "x12_tidy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x12_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
