[project]
name = "x12-tidy"
version = "0.1.0"
description = "Validate and repair malformed ANSI X12 EDI documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Schertz", email = "michael.schertz@gmail.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tidyedi/x12-tidy"
Repository = "https://github.com/tidyedi/x12-tidy"
Documentation = "https://docs.tidyedi.com/finding-the-isa-line.html"

[project.scripts]
x12-tidy = "x12_tidy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x12_tidy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
