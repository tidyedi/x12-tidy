name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: diagnostics doc is in sync with codes.py
        run: uv run python scripts/gen_diagnostics_docs.py --check
      - name: tests
        run: uv run pytest -q
