name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) -- no API token.
# Set up once at https://pypi.org/manage/project/x12-tidy/settings/publishing/
# (or a pending publisher before the project exists):
#   owner: ubeast   repository: x12-tidy   workflow: release.yml   environment: pypi
#
# To cut a release: bump the version in pyproject.toml + src/x12_tidy/__init__.py,
# commit, then push a tag:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run python scripts/gen_diagnostics_docs.py --check
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
