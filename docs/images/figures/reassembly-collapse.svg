<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Three rows. Raw split keeps an empty piece between two segments where the sender doubled the terminator. Dropping empty segments removes that piece. Rejoining puts exactly one terminator after every remaining segment, including the last, regardless of what the sender originally left at the end.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <g font-size="11.5">
    <text x="12" y="18" fill="var(--ink-soft)" font-size="10.5" letter-spacing="0.06em">1. RAW SPLIT &#8212; EMPTIES KEPT</text>
    <rect x="12" y="28" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="72" y="47" text-anchor="middle" fill="currentColor">ST*850*0001</text>
    <rect x="144" y="28" width="90" height="30" rx="4" fill="none" stroke="var(--deviation)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="189" y="47" text-anchor="middle" fill="var(--deviation)">&#8220;&#8221;</text>
    <rect x="246" y="28" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="306" y="47" text-anchor="middle" fill="currentColor">SE*3*0001</text>
    <text x="380" y="47" fill="var(--ink-soft)" font-size="10.5">&#8592; two terminators in a row (&#8220;~~&#8221;) split into an empty piece</text>

    <line x1="12" y1="80" x2="748" y2="80" stroke="var(--rule)" stroke-width="1"/>

    <text x="12" y="102" fill="var(--ink-soft)" font-size="10.5" letter-spacing="0.06em">2. DROP EMPTY SEGMENTS</text>
    <rect x="12" y="112" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="72" y="131" text-anchor="middle" fill="currentColor">ST*850*0001</text>
    <rect x="144" y="112" width="90" height="30" rx="4" fill="none" stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="2 3"/>
    <line x1="150" y1="118" x2="228" y2="136" stroke="var(--deviation)" stroke-width="1.3"/>
    <line x1="150" y1="136" x2="228" y2="118" stroke="var(--deviation)" stroke-width="1.3"/>
    <rect x="246" y="112" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="306" y="131" text-anchor="middle" fill="currentColor">SE*3*0001</text>
    <text x="380" y="131" fill="var(--ink-soft)" font-size="10.5">&#8592; an empty piece is not a segment</text>

    <line x1="12" y1="164" x2="748" y2="164" stroke="var(--rule)" stroke-width="1"/>

    <text x="12" y="186" fill="var(--ink-soft)" font-size="10.5" letter-spacing="0.06em">3. REJOINED &#8212; ONE TERMINATOR, EVERY TIME</text>
    <rect x="12" y="196" width="700" height="34" rx="4" fill="none" stroke="var(--valid)" stroke-width="1.4"/>
    <text x="30" y="218" fill="var(--valid)" font-size="12">...&#8202;ST*850*0001<tspan fill="currentColor" font-weight="600">~</tspan>SE*3*0001<tspan fill="currentColor" font-weight="600">~</tspan>GE*1*1<tspan fill="currentColor" font-weight="600">~</tspan>IEA*1*000000001<tspan fill="currentColor" font-weight="600">~</tspan></text>
    <text x="12" y="252" fill="var(--ink-soft)" font-size="10.5">Whatever the sender left after the last segment &#8212; nothing, one terminator, a stray newline, two in a row &#8212; the output always ends in exactly one.</text>
  </g>
</svg>
