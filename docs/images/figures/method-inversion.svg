<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-label="A conventional reader goes structure to delimiters to values, and fails at the first step when the structure is wrong. x12-tidy goes shape to delimiters, treats the delimiters as ground truth, then structure, then values.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <g font-family="'IBM Plex Mono', monospace" font-size="11.5">
    <text x="12" y="16" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">CONVENTIONAL READER</text>
    <g transform="translate(12,30)">
      <rect x="0" y="0" width="150" height="40" rx="4" fill="none" stroke="var(--deviation)" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle" fill="var(--deviation)">trust the offsets</text>
      <path d="M150 20 L188 20" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#m-a)"/>
      <rect x="190" y="0" width="150" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="265" y="24" text-anchor="middle" fill="currentColor">read delimiters</text>
      <path d="M340 20 L378 20" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#m-a)"/>
      <rect x="380" y="0" width="150" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="455" y="24" text-anchor="middle" fill="currentColor">values</text>
      <text x="545" y="18" fill="var(--deviation)" font-size="10.5">structure wrong</text>
      <text x="545" y="33" fill="var(--deviation)" font-size="10.5">&#8594; already failed</text>
    </g>

    <line x1="12" y1="104" x2="768" y2="104" stroke="var(--rule)" stroke-width="1.1"/>

    <text x="12" y="132" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">x12-tidy</text>
    <g transform="translate(12,146)">
      <rect x="0" y="0" width="120" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="60" y="24" text-anchor="middle" fill="currentColor">shape</text>
      <path d="M120 20 L152 20" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#m-a)"/>
      <rect x="154" y="0" width="150" height="40" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.7"/>
      <text x="229" y="19" text-anchor="middle" fill="var(--accent)" font-weight="700">delimiters</text>
      <text x="229" y="33" text-anchor="middle" fill="var(--ink-soft)" font-size="9">ground truth</text>
      <path d="M304 20 L336 20" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#m-a)"/>
      <rect x="338" y="0" width="150" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="413" y="24" text-anchor="middle" fill="currentColor">structure</text>
      <path d="M488 20 L520 20" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" marker-end="url(#m-a)"/>
      <rect x="522" y="0" width="150" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="597" y="24" text-anchor="middle" fill="currentColor">values</text>
    </g>
    <defs>
      <marker id="m-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 1 L9 5 L0 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/>
      </marker>
    </defs>
  </g>
</svg>
