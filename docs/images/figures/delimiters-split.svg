<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-label="Splitting the run on the element separator yields seventeen pieces: the literal ISA, ISA01 through ISA15, and a seventeenth piece that is ISA16 plus the segment terminator plus any trailing bytes.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>

  <g font-family="'IBM Plex Mono', monospace">

    <text x="12" y="18" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">THE RUN &#8212; ISA &#8230; up to GS, exactly 16 element separators</text>
    <g transform="translate(12,30)" font-size="12.5">
      <rect x="0" y="0" width="50" height="34" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="25" y="22" text-anchor="middle" fill="currentColor">ISA</text>
      <text x="60" y="22" fill="var(--accent)" font-weight="700">*</text>
      <rect x="72" y="0" width="180" height="34" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="162" y="22" text-anchor="middle" fill="currentColor">ISA01 * ISA02 * &#8230;</text>
      <text x="262" y="22" fill="var(--accent)" font-weight="700">*</text>
      <rect x="274" y="0" width="130" height="34" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="339" y="22" text-anchor="middle" fill="currentColor">&#8230; * ISA15</text>
      <text x="414" y="22" fill="var(--accent)" font-weight="700">*</text>
      <rect x="426" y="0" width="22" height="34" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4"/>
      <text x="437" y="22" text-anchor="middle" fill="var(--accent)">:</text>
      <rect x="448" y="0" width="22" height="34" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4"/>
      <text x="459" y="22" text-anchor="middle" fill="var(--accent)">~</text>
      <rect x="470" y="0" width="40" height="34" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="2 2"/>
      <text x="490" y="22" text-anchor="middle" fill="var(--ink-soft)" font-size="10.5">CR LF</text>
      <rect x="510" y="0" width="46" height="34" fill="none" stroke="var(--valid)" stroke-width="1.6"/>
      <text x="533" y="22" text-anchor="middle" fill="var(--valid)">GS*</text>
    </g>

    <text x="300" y="98" text-anchor="middle" fill="currentColor" font-size="12">split on the element separator &#8594; 17 pieces</text>
    <path d="M300 78 L300 106" fill="none" stroke="var(--ink-soft)" stroke-width="1.4" marker-end="url(#pk-arrow)"/>
    <defs>
      <marker id="pk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0 1 L9 5 L0 9" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"/>
      </marker>
    </defs>

    <g transform="translate(12,124)" font-size="12">
      <rect x="0" y="0" width="58" height="38" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="29" y="16" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">1st</text>
      <text x="29" y="30" text-anchor="middle" fill="currentColor">ISA</text>

      <rect x="66" y="0" width="330" height="38" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="231" y="16" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">2nd &#8211; 16th</text>
      <text x="231" y="30" text-anchor="middle" fill="currentColor">ISA01 &#8230; ISA15</text>

      <rect x="404" y="0" width="352" height="38" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="580" y="16" text-anchor="middle" font-size="9.5" fill="var(--accent)">17th &#8212; the last piece</text>
      <text x="580" y="30" text-anchor="middle" fill="currentColor">ISA16 + terminator + trailing</text>
    </g>

    <g transform="translate(400,196)" font-size="12">
      <path d="M180 -22 L180 -6" fill="none" stroke="var(--accent)" stroke-width="1.4"/>
      <rect x="6" y="0" width="32" height="30" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="22" y="20" text-anchor="middle" fill="currentColor">:</text>
      <text x="22" y="46" text-anchor="middle" font-size="10" fill="var(--accent)">ISA16</text>
      <text x="22" y="59" text-anchor="middle" font-size="10" fill="var(--ink-soft)">component</text>

      <rect x="132" y="0" width="32" height="30" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="148" y="20" text-anchor="middle" fill="currentColor">~</text>
      <text x="148" y="46" text-anchor="middle" font-size="10" fill="var(--accent)">1 byte</text>
      <text x="148" y="59" text-anchor="middle" font-size="10" fill="var(--ink-soft)">terminator</text>

      <rect x="258" y="0" width="118" height="30" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="2 2"/>
      <text x="317" y="20" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">CR LF &#8230;</text>
      <text x="317" y="46" text-anchor="middle" font-size="10" fill="currentColor">the rest</text>
      <text x="317" y="59" text-anchor="middle" font-size="10" fill="var(--ink-soft)">trailing</text>
    </g>
  </g>
</svg>
