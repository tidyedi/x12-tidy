<!doctype html><html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1408px;height:768px;}
  .stage{
    position:relative;width:1408px;height:768px;overflow:hidden;
    background:#0e141a url('plate24.png') center/1408px 768px no-repeat;
    font-family:'IBM Plex Sans',-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  .scrim-top{position:absolute;inset:0 0 auto 0;height:150px;
    background:linear-gradient(180deg,rgba(6,10,14,.92),rgba(6,10,14,.55) 55%,transparent);}
  .scrim-bot{position:absolute;inset:auto 0 0 0;height:400px;
    background:linear-gradient(0deg,rgba(7,11,15,1) 0%,rgba(7,11,15,1) 34%,rgba(7,11,15,.88) 58%,rgba(7,11,15,.4) 84%,transparent);}
  .top{position:absolute;left:56px;right:56px;top:34px;display:flex;align-items:center;justify-content:space-between;z-index:3;}
  .brand{display:flex;align-items:center;gap:12px;}
  .mark{width:40px;height:40px;border-radius:9px;background:#1F6B4D;position:relative;flex:0 0 auto;
    box-shadow:0 2px 14px rgba(0,0,0,.5);}
  .mark i{position:absolute;left:11px;height:3.4px;border-radius:2px;background:#F3F8F5;}
  .mark i:nth-child(1){top:9px;width:22px;left:7px;opacity:.34;}
  .mark i:nth-child(2){top:16px;width:17px;}
  .mark i:nth-child(3){top:23px;width:17px;}
  .mark i:nth-child(4){top:30px;width:17px;}
  .wordmark{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;font-size:21px;color:#eef2f5;letter-spacing:.5px;}
  .install{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;color:#aeb9c4;}
  .block{position:absolute;left:56px;bottom:52px;z-index:3;}
  .kicker{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;letter-spacing:.14em;
    color:#7bc894;text-transform:uppercase;margin-bottom:14px;}
  h1{font-weight:800;font-size:52px;line-height:1.1;letter-spacing:-1px;color:#f4f7f9;max-width:1040px;}
  h1 .g{color:#7bc894;}
  .sub{margin-top:16px;font-size:20px;font-weight:600;color:#c3ccd4;max-width:900px;}
  .sub b{color:#f4f7f9;}
</style></head>
<body>
<div class="stage">
  <div class="scrim-top"></div>
  <div class="scrim-bot"></div>

  <div class="top">
    <div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span><span class="wordmark">x12-tidy</span></div>
    <div class="install">pip install x12-tidy</div>
  </div>

  <div class="block">
    <div class="kicker">Validate &amp; repair malformed ANSI X12 EDI</div>
    <h1>Why did your X12 file fail? <span class="g">x12-tidy tells you&nbsp;&mdash; every&nbsp;deviation.</span></h1>
    <div class="sub">It names each departure from the standard with a byte offset, and hands back a <b>clean, conformant copy</b>.</div>
  </div>
</div>
</body></html>
