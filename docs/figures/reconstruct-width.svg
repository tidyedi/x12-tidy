<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" role="img" aria-label="An offset parser applies a fixed ruler at bytes 89 to 98 to read ISA13. On a line whose blank ISA02 was right-trimmed, that window straddles the ISA12 and ISA14 boundary and reads garbage. x12-tidy instead holds sixteen element values from a single split, of ragged length, and only needs to pad the short ones.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <g font-family="'IBM Plex Mono', monospace" font-size="12">

    <text x="12" y="16" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">OFFSET PARSER &#8212; fixed window at bytes 89&#8211;98 for ISA13</text>
    <g transform="translate(12,28)">
      <rect x="0" y="0" width="120" height="30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="60" y="19" text-anchor="middle" fill="var(--ink-soft)" font-size="10.5">&#8230; ISA11 *</text>
      <rect x="120" y="0" width="70" height="30" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <text x="155" y="19" text-anchor="middle" fill="currentColor" font-size="10.5">ISA12</text>
      <rect x="190" y="0" width="150" height="30" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <text x="265" y="19" text-anchor="middle" fill="currentColor" font-size="10.5">ISA13 (as sent)</text>
      <rect x="340" y="0" width="60" height="30" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <text x="370" y="19" text-anchor="middle" fill="currentColor" font-size="10.5">ISA14</text>
      <rect x="150" y="-8" width="150" height="46" fill="none" stroke="var(--deviation)" stroke-width="1.8"/>
      <text x="225" y="54" text-anchor="middle" fill="var(--deviation)" font-size="10.5">bytes 89&#8211;98 &#8212; lands on the ISA12 / ISA13 seam</text>
    </g>

    <line x1="12" y1="104" x2="768" y2="104" stroke="var(--rule)" stroke-width="1.1"/>

    <text x="12" y="132" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">x12-tidy &#8212; sixteen values from one split, ragged, not yet width-checked</text>
    <g transform="translate(12,144)" font-size="10.5">
      <rect x="0" y="0" width="34" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="17" y="18" text-anchor="middle" fill="currentColor">01</text>
      <rect x="38" y="0" width="14" height="28" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/><text x="45" y="18" text-anchor="middle" fill="var(--accent)">2</text>
      <rect x="56" y="0" width="80" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="96" y="18" text-anchor="middle" fill="currentColor">03&#8230;08</text>
      <rect x="140" y="0" width="60" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="170" y="18" text-anchor="middle" fill="currentColor">09</text>
      <rect x="204" y="0" width="24" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="216" y="18" text-anchor="middle" fill="currentColor">10</text>
      <rect x="232" y="0" width="14" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="239" y="18" text-anchor="middle" fill="currentColor">11</text>
      <rect x="250" y="0" width="18" height="28" fill="none" stroke="var(--deviation)" stroke-width="1.4"/><text x="259" y="18" text-anchor="middle" fill="var(--deviation)">12</text>
      <rect x="272" y="0" width="96" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="320" y="18" text-anchor="middle" fill="currentColor">13</text>
      <rect x="372" y="0" width="18" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="381" y="18" text-anchor="middle" fill="currentColor">14</text>
      <rect x="394" y="0" width="18" height="28" fill="none" stroke="currentColor" stroke-width="1.2"/><text x="403" y="18" text-anchor="middle" fill="currentColor">15</text>
      <rect x="416" y="0" width="16" height="28" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/><text x="424" y="18" text-anchor="middle" fill="var(--accent)">:</text>
      <text x="446" y="18" fill="var(--ink-soft)">&#8592; the boundaries are known; only the lengths are wrong</text>
      <text x="0" y="52" fill="var(--valid)" font-size="10.5">pad ISA12 back to 5 &#183; leave the rest &#183; the line is 105 again</text>
    </g>
  </g>
</svg>
