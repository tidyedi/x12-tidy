<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="The four X12 delimiters. In a conformant ISA line the element separator is at byte 3, ISA11 is the repetition separator, ISA16 (the component separator) is at byte 104, and the segment terminator is a separate byte at 105. In a line whose ISA02 and ISA04 were stripped, byte 3 is unchanged and every other delimiter has moved left.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>

  <g font-family="'IBM Plex Mono', monospace" font-size="12.5">

    <text x="12" y="20" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">CONFORMANT &#8212; where the standard puts them</text>
    <g transform="translate(0,34)">
      <rect x="12" y="0" width="52" height="40" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="38" y="25" text-anchor="middle" fill="currentColor">ISA</text>

      <rect x="64" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="76" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">*</text>

      <rect x="88" y="0" width="352" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="264" y="25" text-anchor="middle" fill="currentColor">ISA01 * &#8230; * ISA10 *</text>

      <rect x="440" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="452" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">^</text>

      <rect x="464" y="0" width="176" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="552" y="25" text-anchor="middle" fill="currentColor">ISA12 * &#8230; * ISA15 *</text>

      <rect x="640" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="652" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">:</text>
      <rect x="664" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="676" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">~</text>

      <rect x="688" y="0" width="56" height="40" fill="none" stroke="var(--valid)" stroke-width="1.6"/>
      <text x="716" y="25" text-anchor="middle" fill="var(--valid)">GS*</text>

      <g font-size="11.5">
        <path d="M76 40 L76 62" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <text x="76" y="80" text-anchor="middle" fill="currentColor">byte 3</text>
        <text x="76" y="96" text-anchor="middle" fill="var(--accent)">element</text>

        <path d="M452 40 L452 62" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <text x="452" y="80" text-anchor="middle" fill="currentColor">ISA11</text>
        <text x="452" y="96" text-anchor="middle" fill="var(--accent)">repetition</text>

        <path d="M652 40 L652 52 L590 52 L590 62" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <text x="590" y="80" text-anchor="middle" fill="currentColor">ISA16 &#183; byte 104</text>
        <text x="590" y="96" text-anchor="middle" fill="var(--accent)">component</text>

        <path d="M676 40 L676 52 L730 52 L730 62" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <text x="730" y="80" text-anchor="middle" fill="currentColor">byte 105</text>
        <text x="730" y="96" text-anchor="middle" fill="var(--accent)">terminator</text>
      </g>
    </g>

    <line x1="12" y1="190" x2="768" y2="190" stroke="var(--rule)" stroke-width="1.2"/>

    <text x="12" y="222" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">RECEIVED &#8212; ISA02 and ISA04 stripped: byte 3 holds, the rest moved</text>
    <g transform="translate(0,236)">
      <rect x="12" y="0" width="52" height="40" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <text x="38" y="25" text-anchor="middle" fill="currentColor">ISA</text>

      <rect x="64" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="76" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">*</text>

      <rect x="88" y="0" width="300" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="238" y="25" text-anchor="middle" fill="currentColor">ISA01 ** &#8230; * ISA10 *</text>

      <rect x="388" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="400" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">^</text>

      <rect x="412" y="0" width="150" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
      <text x="487" y="25" text-anchor="middle" fill="currentColor">ISA12 * &#8230; * ISA15 *</text>

      <rect x="562" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="574" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">:</text>
      <rect x="586" y="0" width="24" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="598" y="26" text-anchor="middle" fill="var(--accent)" font-weight="700">~</text>

      <rect x="610" y="0" width="56" height="40" fill="none" stroke="var(--valid)" stroke-width="1.6"/>
      <text x="638" y="25" text-anchor="middle" fill="var(--valid)">GS*</text>

      <g font-size="11.5">
        <path d="M76 40 L76 60" fill="none" stroke="var(--valid)" stroke-width="1.3"/>
        <text x="76" y="78" text-anchor="middle" fill="var(--valid)">byte 3 &#10003;</text>

        <path d="M574 40 L574 60" fill="none" stroke="var(--deviation)" stroke-width="1.3"/>
        <text x="574" y="78" text-anchor="middle" fill="var(--deviation)">was byte 104</text>
      </g>
    </g>
  </g>
</svg>
