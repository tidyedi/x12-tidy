<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="The four X12 delimiters. In a conformant ISA line the element separator is at byte 3, the repetition separator is ISA11, the component separator is at byte 104, and the segment terminator is at byte 105. In a received line whose ISA02 and ISA04 were stripped, byte 3 is unchanged but every other delimiter position has moved left.">
  <style>
    :root {
      --fg: #3d4450; --muted: #6b7280; --rule: #d0d7de;
      --accent: #0e6f86; --accent-soft: #ddf4ff;
      --valid: #1a7f37; --deviation: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #adbac7; --muted: #8b949e; --rule: #373e47;
        --accent: #45b8d0; --accent-soft: #1c2b3a;
        --valid: #57ab5a; --deviation: #e5534b;
      }
    }
    text { fill: var(--fg); font-family: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
    .lbl { fill: var(--muted); font-size: 10px; letter-spacing: 0.08em; }
    .d { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.1; }
    .dt { fill: var(--accent); font-size: 11px; }
    .box { fill: none; stroke: var(--fg); stroke-width: 1.1; }
    .dash { fill: none; stroke: var(--fg); stroke-width: 1.1; stroke-dasharray: 3 3; }
    .tick { stroke: var(--muted); stroke-width: 1; fill: none; }
  </style>

  <!-- ===================== conformant ===================== -->
  <text class="lbl" x="10" y="26">CONFORMANT &#8212; delimiters where the standard puts them</text>

  <g transform="translate(0,36)">
    <rect class="box" x="10" y="10" width="40" height="30"/>
    <text x="30" y="30" text-anchor="middle" font-size="11">ISA</text>

    <rect class="d" x="50" y="10" width="16" height="30"/>
    <text class="dt" x="58" y="30" text-anchor="middle">*</text>

    <rect class="dash" x="66" y="10" width="360" height="30"/>
    <text x="246" y="29" text-anchor="middle" fill="var(--muted)" font-size="10">ISA01 * &#8230; * ISA10 *</text>

    <rect class="d" x="426" y="10" width="16" height="30"/>
    <text class="dt" x="434" y="30" text-anchor="middle">^</text>

    <rect class="dash" x="442" y="10" width="150" height="30"/>
    <text x="517" y="29" text-anchor="middle" fill="var(--muted)" font-size="10">ISA12 * &#8230; * ISA15</text>

    <rect class="d" x="592" y="10" width="16" height="30"/>
    <text class="dt" x="600" y="30" text-anchor="middle">:</text>

    <rect class="d" x="608" y="10" width="16" height="30"/>
    <text class="dt" x="616" y="30" text-anchor="middle">~</text>

    <rect class="box" x="624" y="10" width="40" height="30" stroke="var(--valid)"/>
    <text x="644" y="30" text-anchor="middle" fill="var(--valid)" font-size="11">GS*</text>

    <!-- pointers -->
    <g font-size="9.5" fill="var(--muted)">
      <line class="tick" x1="58" y1="40" x2="58" y2="58"/>
      <text x="58" y="70" text-anchor="middle">byte 3</text>
      <text x="58" y="82" text-anchor="middle" fill="var(--accent)">element</text>

      <line class="tick" x1="434" y1="40" x2="434" y2="58"/>
      <text x="434" y="70" text-anchor="middle">ISA11</text>
      <text x="434" y="82" text-anchor="middle" fill="var(--accent)">repetition</text>

      <path class="tick" d="M600 40 L600 50 L540 50 L540 58"/>
      <text x="540" y="70" text-anchor="middle">byte 104</text>
      <text x="540" y="82" text-anchor="middle" fill="var(--accent)">component</text>

      <path class="tick" d="M616 40 L616 50 L688 50 L688 58"/>
      <text x="688" y="70" text-anchor="middle">byte 105</text>
      <text x="688" y="82" text-anchor="middle" fill="var(--accent)">terminator</text>
    </g>
  </g>

  <line x1="10" y1="176" x2="750" y2="176" stroke="var(--rule)" stroke-width="1"/>

  <!-- ===================== received ===================== -->
  <text class="lbl" x="10" y="204">RECEIVED &#8212; ISA02 and ISA04 stripped: byte 3 holds, the rest have moved</text>

  <g transform="translate(0,214)">
    <rect class="box" x="10" y="10" width="40" height="30"/>
    <text x="30" y="30" text-anchor="middle" font-size="11">ISA</text>

    <rect class="d" x="50" y="10" width="16" height="30"/>
    <text class="dt" x="58" y="30" text-anchor="middle">*</text>

    <rect class="dash" x="66" y="10" width="300" height="30"/>
    <text x="216" y="29" text-anchor="middle" fill="var(--muted)" font-size="10">ISA01 ** &#8230; * ISA10 *</text>

    <rect class="d" x="366" y="10" width="16" height="30"/>
    <text class="dt" x="374" y="30" text-anchor="middle">^</text>

    <rect class="dash" x="382" y="10" width="130" height="30"/>
    <text x="447" y="29" text-anchor="middle" fill="var(--muted)" font-size="10">ISA12 * &#8230; * ISA15</text>

    <rect class="d" x="512" y="10" width="16" height="30"/>
    <text class="dt" x="520" y="30" text-anchor="middle">:</text>
    <rect class="d" x="528" y="10" width="16" height="30"/>
    <text class="dt" x="536" y="30" text-anchor="middle">~</text>

    <rect class="box" x="544" y="10" width="40" height="30" stroke="var(--valid)"/>
    <text x="564" y="30" text-anchor="middle" fill="var(--valid)" font-size="11">GS*</text>

    <g font-size="9.5">
      <line class="tick" x1="58" y1="40" x2="58" y2="58" stroke="var(--valid)"/>
      <text x="58" y="70" text-anchor="middle" fill="var(--valid)">byte 3 &#10003;</text>

      <line class="tick" x1="520" y1="40" x2="520" y2="58" stroke="var(--deviation)"/>
      <text x="520" y="70" text-anchor="middle" fill="var(--deviation)">was byte 104</text>
      <text x="536" y="58" font-size="8.5" fill="var(--deviation)">&#8722;12</text>
    </g>
  </g>
</svg>
