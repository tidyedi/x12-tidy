<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" role="img" aria-label="The ISA segment wraps GS functional groups, which wrap ST transaction sets, closed in reverse by SE, GE, IEA. The ISA record is fixed at 105 bytes and its byte positions declare the four delimiters. When a BOM is prepended and a blank element omitted, byte 106 no longer lands on GS — it lands inside a field.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <g font-family="'IBM Plex Mono', monospace" font-size="11.5">
    <text x="12" y="16" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">THE ENVELOPE STACK</text>
    <g transform="translate(12,26)">
      <rect x="0" y="0" width="470" height="96" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <text x="10" y="17" fill="var(--accent)">ISA</text>
      <rect x="60" y="24" width="392" height="60" rx="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="70" y="40" fill="currentColor">GS</text>
      <rect x="112" y="46" width="320" height="30" rx="3" fill="none" stroke="var(--ink-soft)" stroke-width="1.2"/>
      <text x="122" y="65" fill="var(--ink-soft)">ST &#8230; SE</text>
      <text x="330" y="17" fill="var(--ink-soft)" font-size="10">&#8230; IEA / GE / SE close in reverse</text>
    </g>

    <line x1="12" y1="146" x2="768" y2="146" stroke="var(--rule)" stroke-width="1.1"/>

    <text x="12" y="172" fill="var(--ink-soft)" font-size="11" letter-spacing="0.06em">THE ISA RECORD &#8212; 105 bytes, positions declare the delimiters</text>
    <g transform="translate(12,182)" font-size="10.5">
      <rect x="0" y="0" width="40" height="26" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="20" y="17" text-anchor="middle" fill="currentColor">ISA</text>
      <rect x="40" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="47" y="17" text-anchor="middle" fill="var(--accent)">*</text>
      <rect x="54" y="0" width="470" height="26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/><text x="289" y="17" text-anchor="middle" fill="currentColor">ISA01 * &#8230; * ISA15 *</text>
      <rect x="524" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="531" y="17" text-anchor="middle" fill="var(--accent)">:</text>
      <rect x="538" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="545" y="17" text-anchor="middle" fill="var(--accent)">~</text>
      <rect x="552" y="0" width="46" height="26" fill="none" stroke="var(--valid)" stroke-width="1.5"/><text x="575" y="17" text-anchor="middle" fill="var(--valid)">GS*</text>
      <text x="47" y="42" text-anchor="middle" fill="var(--ink-soft)" font-size="9">byte 3</text>
      <text x="531" y="42" text-anchor="middle" fill="var(--ink-soft)" font-size="9">104</text>
      <text x="545" y="42" text-anchor="middle" fill="var(--ink-soft)" font-size="9">105</text>
      <text x="575" y="42" text-anchor="middle" fill="var(--valid)" font-size="9">106</text>
    </g>

    <g transform="translate(12,244)" font-size="10.5">
      <rect x="0" y="0" width="34" height="26" fill="none" stroke="var(--deviation)" stroke-width="1.3"/><text x="17" y="17" text-anchor="middle" fill="var(--deviation)">BOM</text>
      <rect x="34" y="0" width="40" height="26" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="54" y="17" text-anchor="middle" fill="currentColor">ISA</text>
      <rect x="74" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="81" y="17" text-anchor="middle" fill="var(--accent)">*</text>
      <rect x="88" y="0" width="430" height="26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3"/><text x="303" y="17" text-anchor="middle" fill="currentColor">ISA01 ** &#8230; (one blank element omitted)</text>
      <rect x="518" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="525" y="17" text-anchor="middle" fill="var(--accent)">:</text>
      <rect x="532" y="0" width="14" height="26" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/><text x="539" y="17" text-anchor="middle" fill="var(--accent)">~</text>
      <rect x="546" y="0" width="46" height="26" fill="none" stroke="var(--valid)" stroke-width="1.5"/><text x="569" y="17" text-anchor="middle" fill="var(--valid)">GS*</text>
      <line x1="575" y1="-58" x2="575" y2="26" stroke="var(--deviation)" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text x="600" y="17" fill="var(--deviation)">byte 106 lands here &#8212; inside a field</text>
    </g>
  </g>
</svg>
