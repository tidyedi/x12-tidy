<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Two byte streams compared. In the conformant stream, byte 106 lands exactly on the GS tag. In the received stream, a three-byte BOM is prepended and one element is stripped, so byte 106 now lands in the middle of an element, not on GS.">
  <style>
    :root {
      --fg: #3d4450; --muted: #6b7280; --rule: #d0d7de;
      --accent-soft: #ddf4ff; --valid: #1a7f37; --deviation: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #adbac7; --muted: #8b949e; --rule: #373e47;
        --accent-soft: #1c2b3a; --valid: #57ab5a; --deviation: #e5534b;
      }
    }
    text { fill: var(--fg); font-family: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>

  <g font-size="11.5">
    <text x="10" y="30" fill="var(--muted)" font-size="10.5" letter-spacing="0.08em">CONFORMANT</text>
    <rect x="10" y="40" width="46" height="34" fill="none" stroke="var(--fg)" stroke-width="1.1"/>
    <text x="33" y="62" text-anchor="middle">ISA</text>
    <rect x="56" y="40" width="470" height="34" fill="none" stroke="var(--fg)" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="291" y="62" text-anchor="middle" fill="var(--muted)" font-size="10.5">105 bytes: ISA01 … ISA16 : ~</text>
    <rect x="526" y="40" width="48" height="34" fill="none" stroke="var(--valid)" stroke-width="1.4"/>
    <text x="550" y="62" text-anchor="middle" fill="var(--valid)">GS*</text>

    <line x1="526" y1="82" x2="526" y2="102" stroke="var(--valid)" stroke-width="1.2"/>
    <polygon points="526,80 522,88 530,88" fill="var(--valid)"/>
    <text x="526" y="118" text-anchor="middle" fill="var(--valid)" font-size="10.5">byte 106 → GS ✓</text>

    <line x1="10" y1="146" x2="750" y2="146" stroke="var(--rule)" stroke-width="1"/>

    <text x="10" y="180" fill="var(--muted)" font-size="10.5" letter-spacing="0.08em">AS RECEIVED</text>
    <rect x="10" y="190" width="34" height="34" fill="var(--accent-soft)" stroke="var(--deviation)" stroke-width="1.1"/>
    <text x="27" y="212" text-anchor="middle" fill="var(--deviation)" font-size="10">BOM</text>
    <rect x="44" y="190" width="46" height="34" fill="none" stroke="var(--fg)" stroke-width="1.1"/>
    <text x="67" y="212" text-anchor="middle">ISA</text>
    <rect x="90" y="190" width="360" height="34" fill="none" stroke="var(--fg)" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="270" y="208" text-anchor="middle" fill="var(--muted)" font-size="10">ISA02 stripped → 96 bytes</text>
    <text x="270" y="220" text-anchor="middle" fill="var(--deviation)" font-size="9.5">every downstream offset shifted</text>
    <rect x="450" y="190" width="90" height="34" fill="none" stroke="var(--fg)" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="495" y="212" text-anchor="middle" fill="var(--muted)" font-size="10">… ISA16 : ~</text>
    <rect x="540" y="190" width="48" height="34" fill="none" stroke="var(--valid)" stroke-width="1.4"/>
    <text x="564" y="212" text-anchor="middle" fill="var(--valid)">GS*</text>

    <line x1="450" y1="232" x2="450" y2="252" stroke="var(--deviation)" stroke-width="1.2"/>
    <polygon points="450,230 446,238 454,238" fill="var(--deviation)"/>
    <text x="450" y="268" text-anchor="middle" fill="var(--deviation)" font-size="10.5">byte 106 → mid-element ✗</text>
  </g>
</svg>
