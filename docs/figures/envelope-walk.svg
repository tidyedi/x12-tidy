<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-label="A sequence of segment identifiers: GS, ST, SE, ST, SE, GE, IEA. A brace beneath GS through GE spans the open functional group. Two shorter braces beneath each ST-through-SE pair span the open transaction set. The stack holds at most one open group and, inside it, at most one open transaction set at any point in the walk.">
  <style>
    svg { color: #17212b; }
    :root {
      --ink-soft: #566470; --rule: #d2d8dc;
      --accent: #0e6f86; --accent-soft: #dbeaee;
      --valid: #467a4e; --deviation: #ac5230;
    }
    @media (prefers-color-scheme: dark) {
      svg { color: #dce4e9; }
      :root {
        --ink-soft: #93a1ac; --rule: #2a343d;
        --accent: #45b8d0; --accent-soft: #123039;
        --valid: #74b079; --deviation: #dd8b64;
      }
    }
    text { font-family: 'IBM Plex Mono', ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <g font-size="12">
    <text x="12" y="18" fill="var(--ink-soft)" font-size="10.5" letter-spacing="0.06em">THE SEGMENT LIST, ONE PASS</text>

    <!-- identifier boxes -->
    <g font-size="12.5">
      <rect x="12"  y="30" width="70" height="32" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="47"  y="51" text-anchor="middle" fill="var(--accent)">GS</text>
      <rect x="98"  y="30" width="70" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="133" y="51" text-anchor="middle" fill="currentColor">ST</text>
      <rect x="184" y="30" width="70" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="219" y="51" text-anchor="middle" fill="currentColor">SE</text>
      <rect x="270" y="30" width="70" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="305" y="51" text-anchor="middle" fill="currentColor">ST</text>
      <rect x="356" y="30" width="70" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="391" y="51" text-anchor="middle" fill="currentColor">SE</text>
      <rect x="442" y="30" width="70" height="32" rx="4" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="477" y="51" text-anchor="middle" fill="var(--accent)">GE</text>
      <rect x="528" y="30" width="80" height="32" rx="4" fill="none" stroke="var(--valid)" stroke-width="1.5"/>
      <text x="568" y="51" text-anchor="middle" fill="var(--valid)">IEA</text>
    </g>

    <!-- group brace: GS..GE -->
    <path d="M47 70 Q47 90 90 90 L470 90 Q512 90 512 70" fill="none" stroke="var(--accent)" stroke-width="1.3"/>
    <text x="280" y="106" text-anchor="middle" fill="var(--accent)" font-size="10.5">one open functional group (GS06 tracked, GE expected)</text>

    <!-- tx set brace 1: ST..SE -->
    <path d="M133 70 Q133 84 152 84 L200 84 Q219 84 219 70" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <!-- tx set brace 2: ST..SE -->
    <path d="M305 70 Q305 84 324 84 L372 84 Q391 84 391 70" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="176" y="134" text-anchor="middle" fill="currentColor" font-size="10.5">transaction set 1</text>
    <text x="348" y="134" text-anchor="middle" fill="currentColor" font-size="10.5">transaction set 2</text>

    <line x1="12" y1="160" x2="768" y2="160" stroke="var(--rule)" stroke-width="1"/>

    <text x="12" y="184" fill="var(--ink-soft)" font-size="10.5" letter-spacing="0.06em">AT MOST ONE OF EACH, AT ANY MOMENT</text>
    <text x="12" y="206" fill="currentColor" font-size="11">a second GS before GE closes the first (missing-GE) &#8212; then opens the new one</text>
    <text x="12" y="224" fill="currentColor" font-size="11">a second ST before SE closes the first (missing-SE) &#8212; then opens the new one</text>
    <text x="12" y="242" fill="currentColor" font-size="11">end of the segment list with either still open closes it the same way</text>
  </g>
</svg>
