<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-label="A byte-map of the ISA segment: the tag ISA at byte 0, the element separator at byte 3, sixteen fixed-width elements ISA01 through ISA16, the component separator at byte 104, the segment terminator at byte 105, and the GS functional-group header beginning at byte 106.">
  <style>
    :root {
      --fg: #3d4450; --muted: #6b7280; --rule: #d0d7de;
      --accent: #0969da; --accent-soft: #ddf4ff;
      --valid: #1a7f37; --deviation: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #adbac7; --muted: #8b949e; --rule: #373e47;
        --accent: #539bf5; --accent-soft: #1c2b3a;
        --valid: #57ab5a; --deviation: #e5534b;
      }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    text { fill: var(--fg); }
  </style>

  <g class="mono" font-size="12">
    <rect x="10" y="55" width="52" height="40" fill="none" stroke="var(--fg)" stroke-width="1.2"/>
    <text x="36" y="80" text-anchor="middle">ISA</text>

    <rect x="62" y="55" width="20" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="72" y="80" text-anchor="middle" fill="var(--accent)">*</text>

    <rect x="82" y="55" width="520" height="40" fill="none" stroke="var(--fg)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="342" y="74" text-anchor="middle" font-size="11.5">ISA01 * ISA02 * … * ISA15 * ISA16</text>
    <text x="342" y="88" text-anchor="middle" fill="var(--muted)" font-size="10">fixed widths: 2·10·2·10·2·15·2·15·6·4·1·5·9·1·1·1</text>

    <rect x="602" y="55" width="20" height="40" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="612" y="80" text-anchor="middle" fill="var(--accent)">:</text>

    <rect x="622" y="55" width="20" height="40" fill="none" stroke="var(--deviation)" stroke-width="1.2"/>
    <text x="632" y="80" text-anchor="middle" fill="var(--deviation)">~</text>

    <rect x="650" y="55" width="60" height="40" fill="none" stroke="var(--valid)" stroke-width="1.4"/>
    <text x="680" y="80" text-anchor="middle" fill="var(--valid)">GS*</text>
  </g>

  <g class="mono" font-size="10.5">
    <line x1="10" y1="107" x2="710" y2="107" stroke="var(--rule)" stroke-width="1"/>
    <line x1="10" y1="103" x2="10" y2="111" stroke="var(--fg)" stroke-width="1"/>
    <text x="10" y="125" text-anchor="middle" fill="var(--muted)">0</text>
    <line x1="62" y1="103" x2="62" y2="111" stroke="var(--fg)" stroke-width="1"/>
    <text x="62" y="125" text-anchor="middle" fill="var(--muted)">3</text>
    <line x1="602" y1="103" x2="602" y2="111" stroke="var(--fg)" stroke-width="1"/>
    <text x="602" y="125" text-anchor="middle" fill="var(--muted)">104</text>
    <line x1="622" y1="103" x2="622" y2="111" stroke="var(--deviation)" stroke-width="1"/>
    <text x="627" y="125" text-anchor="middle" fill="var(--deviation)">105</text>
    <line x1="650" y1="103" x2="650" y2="111" stroke="var(--valid)" stroke-width="1"/>
    <text x="655" y="125" text-anchor="middle" fill="var(--valid)">106</text>
  </g>

  <g class="sans" font-size="11">
    <path d="M62 160 L62 168 L622 168 L622 160" fill="none" stroke="var(--accent)" stroke-width="1.2"/>
    <path d="M342 168 L342 176" stroke="var(--accent)" stroke-width="1.2"/>
    <text x="342" y="192" text-anchor="middle" fill="var(--accent)">exactly 16 element separators between ISA and GS</text>
  </g>
</svg>
