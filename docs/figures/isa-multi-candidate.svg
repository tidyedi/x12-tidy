<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A flow: the raw bytes yield several ISA offsets. Each candidate is tried in order. For each, the code locates GS and counts the separators before it. A candidate in junk fails the exactly-16 gate and the next is tried. The real candidate passes and its run is returned with a leading-bytes warning.">
  <style>
    :root { --fg: #3d4450; --muted: #6b7280; --valid: #1a7f37; --deviation: #cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #adbac7; --muted: #8b949e; --valid: #57ab5a; --deviation: #e5534b; }
    }
    text { fill: var(--fg); font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--fg)"/>
    </marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--deviation)"/>
    </marker>
    <marker id="av" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="var(--valid)"/>
    </marker>
  </defs>

  <g font-size="12">
    <rect x="250" y="14" width="270" height="34" rx="3" fill="none" stroke="var(--fg)" stroke-width="1.2"/>
    <text x="385" y="35" text-anchor="middle" class="mono" font-size="11">dirty = b"SUBJECT: ISA FILE\n" + …ISA…GS…</text>

    <line x1="385" y1="48" x2="385" y2="72" stroke="var(--fg)" stroke-width="1.1" marker-end="url(#a)"/>
    <text x="397" y="65" fill="var(--muted)" font-size="10.5">find every b"ISA"</text>

    <rect x="120" y="74" width="220" height="30" rx="3" fill="none" stroke="var(--deviation)" stroke-width="1.2"/>
    <text x="230" y="94" text-anchor="middle" fill="var(--deviation)" class="mono" font-size="11">c1 · offset 9  ("ISA FILE")</text>
    <rect x="420" y="74" width="220" height="30" rx="3" fill="none" stroke="var(--valid)" stroke-width="1.2"/>
    <text x="530" y="94" text-anchor="middle" fill="var(--valid)" class="mono" font-size="11">c2 · offset 19 (real segment)</text>

    <line x1="230" y1="104" x2="230" y2="130" stroke="var(--fg)" stroke-width="1.1" marker-end="url(#a)"/>
    <rect x="120" y="132" width="220" height="30" rx="3" fill="none" stroke="var(--fg)" stroke-width="1"/>
    <text x="230" y="152" text-anchor="middle" font-size="11">locate GS, count separators</text>

    <line x1="230" y1="162" x2="230" y2="188" stroke="var(--fg)" stroke-width="1.1" marker-end="url(#a)"/>
    <polygon points="230,190 300,222 230,254 160,222" fill="none" stroke="var(--deviation)" stroke-width="1.3"/>
    <text x="230" y="219" text-anchor="middle" fill="var(--deviation)" font-size="11">== 16 ?</text>
    <text x="230" y="235" text-anchor="middle" fill="var(--deviation)" font-size="10.5">count = 2</text>

    <line x1="300" y1="222" x2="418" y2="222" stroke="var(--deviation)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ad)"/>
    <text x="360" y="214" text-anchor="middle" fill="var(--deviation)" font-size="10.5">no → next candidate</text>

    <line x1="530" y1="104" x2="530" y2="188" stroke="var(--fg)" stroke-width="1.1" marker-end="url(#a)"/>
    <polygon points="530,190 600,222 530,254 460,222" fill="none" stroke="var(--valid)" stroke-width="1.3"/>
    <text x="530" y="219" text-anchor="middle" fill="var(--valid)" font-size="11">== 16 ?</text>
    <text x="530" y="235" text-anchor="middle" fill="var(--valid)" font-size="10.5">count = 16</text>

    <line x1="530" y1="254" x2="530" y2="282" stroke="var(--valid)" stroke-width="1.2" marker-end="url(#av)"/>
    <rect x="400" y="284" width="260" height="44" rx="3" fill="none" stroke="var(--valid)" stroke-width="1.4"/>
    <text x="530" y="302" text-anchor="middle" fill="var(--valid)" font-size="11">return the run</text>
    <text x="530" y="318" text-anchor="middle" fill="var(--muted)" font-size="10">+ isa.leading-bytes (18 bytes skipped)</text>
  </g>
</svg>
