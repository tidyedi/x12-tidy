# Install once:  uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # All work goes on a feature branch + PR -- never commit to main.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      - id: gen-diagnostics-docs
        name: regenerate docs/diagnostics.md from codes.py
        entry: python3 scripts/gen_diagnostics_docs.py
        language: system
        # Run whenever the registry changes; the hook rewrites the doc and
        # stages nothing itself -- pre-commit re-adds a modified file and asks
        # you to commit again.
        files: ^src/edi_linter/diagnostics/codes\.py$
        pass_filenames: false
